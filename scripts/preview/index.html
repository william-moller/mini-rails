<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Rails — placeholder components</title>

<!--
  Dev-only preview of the CSS placeholder layer. Open this file directly in a browser after
  `npm run build`; nothing here is served by BGA (scripts/ is excluded from the deploy allowlist).

  It links the COMPILED stylesheet at the repo root and imports the COMPILED preview bundle, so what
  you see is the real src/scss and src/ts output rather than a hand-written mock-up.

  If the page is blank, run `npm run build` first.

  No server and no deploy needed — double-click this file, or open it with:
    start scripts/preview/index.html      (Windows)
-->
<link rel="stylesheet" href="../../minirailsmospinach.css">

<style>
  /* Page chrome only — not part of the game's stylesheet. */
  body {
    margin: 0;
    padding: 24px 28px 64px;
    background: #f4f6f7;
    color: #1b1b1b;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 {
    font-size: 14px; text-transform: uppercase; letter-spacing: .06em;
    color: #5f6b72; margin: 32px 0 8px;
    border-bottom: 1px solid #d5dbde; padding-bottom: 6px;
  }
  .note { margin: 0 0 12px; font-size: 12px; color: #5f6b72; max-width: 78ch; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin-bottom: 12px; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .swatch > span { font-size: 11px; color: #5f6b72; }
  section { margin-bottom: 8px; }
</style>
</head>
<body>

<h1>Mini Rails — placeholder components</h1>
<p class="note">
  No art files exist yet, so every component below is drawn with CSS shapes. Rendered by the real
  <code>src/ts/components.ts</code> against the real compiled <code>minirailsmospinach.css</code>,
  so this is not a mock-up — changing the source changes this page after a rebuild.
</p>

<div id="preview"></div>

<!-- Classic script, not type="module": Chrome blocks ESM over file:// as cross-origin. -->
<script src="./preview.js"></script>

</body>
</html>
